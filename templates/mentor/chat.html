{% extends 'base.html' %}

{% block title %}Mentor Chat - Marg Darshak{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-4 col-lg-3">
      <div class="card h-100">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">💬 Your Mentors</h5>
        </div>
        <div class="card-body p-0">
          <div class="list-group list-group-flush" id="mentorList"></div>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="col-md-8 col-lg-9">
      <div class="card h-100">
        <div class="card-header bg-light d-flex align-items-center">
          <div class="avatar bg-success rounded-circle me-3" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
            <i class="fas fa-user text-white"></i>
          </div>
          <div>
            <h6 class="mb-0" id="mentorName">Career Mentor</h6>
            <small class="text-muted" id="mentorField">Personal Guidance</small>
          </div>
        </div>

        <div class="card-body d-flex flex-column" style="height:520px;">
          <!-- Messages -->
          <div id="chatBox" class="flex-grow-1 overflow-auto mb-3"></div>

          <!-- Quick Action Buttons -->
          <div class="mb-2">
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-outline-primary btn-sm" onclick="fillPrompt('Please create a career roadmap for me.')">Career Roadmap</button>
              <button class="btn btn-outline-primary btn-sm" onclick="fillPrompt('Can you review my resume and suggest improvements?')">Resume Review</button>
              <button class="btn btn-outline-primary btn-sm" onclick="fillPrompt('I need guidance for choosing the right college.')">College Guidance</button>
              <button class="btn btn-outline-primary btn-sm" onclick="fillPrompt('What skills should I learn for my future?')">Skill Plan</button>
            </div>
          </div>

          <!-- Input Area -->
          <div class="border-top pt-2">
            <div class="input-group mb-2">
              <input id="msgInput" type="text" class="form-control" placeholder="Type your message..." />
              <button class="btn btn-dark" onclick="sendMessage()">Send</button>
            </div>

            <!-- File Upload -->
            <div class="d-flex align-items-center gap-2 mb-3">
              <input type="file" id="fileInput" class="form-control form-control-sm" accept=".pdf,.jpg,.jpeg,.png" />
              <small class="text-muted">Upload resume, marksheet, or screenshot</small>
            </div>

            <div class="text-center">
              <small class="text-muted">Real-time chat coming soon. For now, connect directly:</small>
              <div class="d-flex justify-content-center gap-3 mt-2">
                <button class="btn btn-success btn-sm" onclick="connectViaWhatsApp()">
                  <i class="fab fa-whatsapp me-1"></i>WhatsApp
                </button>
                <button class="btn btn-danger btn-sm" onclick="connectViaEmail()">
                  <i class="fas fa-envelope me-1"></i>Email
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const mentors = [
  { name: "Engineering Mentor", field: "Engineering", number: "917620260012", color: "primary" },
  { name: "Data Science Mentor", field: "Data Science", number: "917620260012", color: "info" },
  { name: "Full Stack Mentor", field: "Full Stack", number: "919890168369", color: "warning" },
  { name: "Cloud Mentor", field: "Cloud", number: "917620260012", color: "secondary" },
  { name: "Medical Mentor", field: "Medical", number: "918010365061", color: "danger" },
  { name: "Pharmacy Mentor", field: "Pharmacy", number: "917558279580", color: "success" },
  { name: "Agriculture Mentor", field: "Agriculture", number: "918010365061", color: "success" },
  { name: "Mechanical Mentor", field: "Mechanical", number: "919022460423", color: "dark" },
  { name: "Electrical Mentor", field: "Electrical", number: "918459056158", color: "primary" },
  { name: "Trading Mentor", field: "Trading", number: "917666782463", color: "secondary" },
  { name: "Data Analyst", field: "Data Analyst", number: "918275121568", color: "success" },
  { name: "Cyber Security", field: "Cyber Security", number: "917620260012", color: "secondary" },
  { name: "ai/Ml Engineer", field: "Ai/Ml", number: "917620260012", color: "secondary" },
  { name: "Finance Mentor", field: "Finance", number: "917620052781", color: "primary" },
  { name: "UI/UX Mentor", field: "Design", number: "917620260012", color: "secondary" }
];

let activeMentor = mentors[0];
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("msgInput");

function renderMentors() {
  const list = document.getElementById("mentorList");
  list.innerHTML = "";

  mentors.forEach((m, i) => {
    const item = `
      <a class="list-group-item list-group-item-action ${i === 0 ? "active" : ""}" onclick="selectMentor(${i})">
        <div class="d-flex align-items-center">
          <div class="avatar bg-${m.color} rounded-circle me-3" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
            <i class="fas fa-user text-white"></i>
          </div>
          <div>
            <h6 class="mb-0">${m.name}</h6>
            <small class="text-muted">${m.field}</small>
          </div>
        </div>
      </a>
    `;
    list.insertAdjacentHTML("beforeend", item);
  });

  selectMentor(0);
}

function selectMentor(index) {
  activeMentor = mentors[index];

  document.querySelectorAll("#mentorList a").forEach(a => a.classList.remove("active"));
  document.querySelectorAll("#mentorList a")[index].classList.add("active");

  document.getElementById("mentorName").innerText = activeMentor.name;
  document.getElementById("mentorField").innerText = activeMentor.field;

  chatBox.innerHTML = `
    <div class="d-flex mb-3">
      <div class="avatar bg-success rounded-circle me-3" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
        <i class="fas fa-user text-white"></i>
      </div>
      <div class="bg-light rounded p-3" style="max-width:70%;">
        <p class="mb-1">Hello! I'm your ${activeMentor.field} mentor. How can I help you?</p>
        <small class="text-muted">${activeMentor.name}</small>
      </div>
    </div>
  `;
}

function fillPrompt(text) {
  input.value = text;
  input.focus();
}

function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;

  const bubble = `
    <div class="d-flex justify-content-end mb-3">
      <div class="bg-dark text-light rounded p-3 me-3" style="max-width:70%;">
        <p class="mb-1">${msg}</p>
        <small class="text-secondary">You</small>
      </div>
    </div>
  `;
  chatBox.insertAdjacentHTML("beforeend", bubble);
  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}

function connectViaWhatsApp() {
  const fileInput = document.getElementById("fileInput");
  let extra = "";

  if (fileInput && fileInput.files.length > 0) {
    extra = "\n\nI have selected a file. I will attach it here.";
  }

  const message = encodeURIComponent(
    "Hi, I am using MargDarshak and would like guidance in " + activeMentor.field + "." + extra
  );

  alert("WhatsApp will open now. Please attach your file in WhatsApp.");
  window.open(`https://wa.me/${activeMentor.number}?text=${message}`, "_blank");
}

function connectViaEmail() {
  const email = "yshelke228@gmail.com";
  const subject = encodeURIComponent("Mentorship Request - MargDarshak");
  const body = encodeURIComponent(
    "Hello Mentor,\n\nI would like guidance in " + activeMentor.field + " on MargDarshak.\n\nThank you."
  );
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
}

document.addEventListener("DOMContentLoaded", renderMentors);
</script>
{% endblock %}
